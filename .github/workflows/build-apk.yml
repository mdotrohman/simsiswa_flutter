name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze & test
        run: |
          flutter analyze
          flutter test

      # Iterasi harian: cukup ABI perangkat utama (arm64-v8a) agar cepat.
      # Versi penuh semua ABI ada di 'build-full.yml' (workflow_dispatch / tag).
      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  ios-build:
    name: "iOS build (validasi semua device)"
    if: github.event_name == 'workflow_dispatch'   # macOS runner berbayar; hanya manual
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign