name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze & test
        run: |
          flutter analyze
          flutter test

      # Iterasi harian: cukup ABI perangkat utama (arm64-v8a) agar cepat.
      # Versi penuh semua ABI ada di 'build-full.yml' (workflow_dispatch / tag).
      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  ios-build:
    name: "iOS build → IPA (validasi semua device)"
    if: github.event_name == 'workflow_dispatch'   # macOS runner berbayar; hanya manual
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze & test
        run: |
          flutter analyze
          flutter test

      # IPA tanpa tanda tangan: belum bisa install langsung di iPhone.
      # Dikemas + di-export; sign ulang di Mac (Xcode/Apple cert) barulah
      # distributable (Ad Hoc/Dev/TestFlight). Lihat README "iOS".
      - name: Build iOS (release, no codesign) + archive ke IPA
        run: |
          flutter build ios --release --no-codesign
          flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa